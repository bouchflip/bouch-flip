<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bouch Flip Frenzy</title>
    <style>
        :root { --bg: #f0f9ff; --text: #2c3e50; --acc: #3498db; }
        [data-theme="dark"] { --bg: #1a1a1a; --text: #ecf0f1; --acc: #e74c3c; }

        body { 
            margin: 0; overflow: hidden; background: var(--bg); 
            font-family: 'Arial Black', sans-serif; transition: 0.3s;
            touch-action: none; -webkit-user-select: none;
        }

        /* Stats & Controls */
        #stats-container { position: absolute; top: 40px; left: 20px; z-index: 10; pointer-events: none; }
        #controls-container { position: absolute; top: 40px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .btn-ui { padding: 10px 15px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; font-size: 10px; background: var(--text); color: var(--bg); }
        
        /* Crazy Flip Text Animation */
        .crazy-text {
            position: absolute; color: #f1c40f; font-size: 32px; font-weight: 900;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
            pointer-events: none; z-index: 200;
            animation: popOut 0.6s forwards ease-out;
        }
        @keyframes popOut {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) translateY(-50px); opacity: 0; }
        }

        /* Bottom Inventory */
        #inventory {
            position: absolute; bottom: -350px; left: 0; width: 100%; height: 320px;
            background: rgba(0,0,0,0.95); color: white; transition: 0.4s;
            z-index: 110; padding: 20px; box-sizing: border-box;
            border-top: 4px solid var(--acc); border-radius: 30px 30px 0 0;
        }
        #inventory.open { bottom: 0; }
        .skin-list { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; }
        .skin-card { min-width: 100px; padding: 15px; border: 2px solid #333; border-radius: 15px; background: #111; flex-shrink: 0; }
        .skin-card.active { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); }
    </style>
</head>
<body>

    <div id="controls-container">
        <button id="theme-toggle" class="btn-ui">THEME</button>
        <button id="inv-toggle" class="btn-ui">SKINS</button>
        <button id="reset-btn" class="btn-ui" style="background:#e74c3c; color:white;">RESET</button>
    </div>

    <div id="inventory">
        <h3 style="margin:0; font-size:16px; color:var(--acc)">Prestige Skins</h3>
        <div id="skin-list" class="skin-list"></div>
    </div>

    <div id="stats-container">
        <p style="font-size:10px; color:var(--acc); margin:0;">FLIPS</p>
        <div id="flipCount" style="font-size:40px; color:var(--text);">0</div>
        <span id="prestigeRank" style="font-size:14px; color:#f1c40f;">Rank: Rookie</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Events, Body } = Matter;
        const engine = Engine.create();
        const render = Render.create({
            element: document.body, engine: engine,
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' }
        });

        let gameState = JSON.parse(localStorage.getItem('bouchSave')) || { flips: 0, prestige: 0, unlockedSkins: [0], currentSkin: 0, theme: 'light' };
        const prestigeTitles = ["Rookie", "Bronze", "Silver", "Gold", "Platinum", "Emerald", "Ruby", "Diamond", "Master", "Grandmaster", "Bouch God"];

        // BOUCH
        const bouch = Bodies.rectangle(window.innerWidth/2, window.innerHeight/2, 100, 140, {
            chamfer: { radius: 20 }, frictionAir: 0.006, restitution: 0.5,
            render: { sprite: { texture: 'Bouch.png', xScale: 0.45, yScale: 0.45 } }
        });

        // WALLS
        const wallThick = 1000;
        function createWalls() {
            const w = window.innerWidth, h = window.innerHeight;
            return [
                Bodies.rectangle(w/2, h + wallThick/2, w, wallThick, { isStatic: true, render: { visible: false } }),
                Bodies.rectangle(w/2, -wallThick/2, w, wallThick, { isStatic: true, render: { visible: false } }),
                Bodies.rectangle(-wallThick/2, h/2, wallThick, h, { isStatic: true, render: { visible: false } }),
                Bodies.rectangle(w + wallThick/2, h/2, wallThick, h, { isStatic: true, render: { visible: false } })
            ];
        }
        Composite.add(engine.world, [bouch, ...createWalls()]);

        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.1, render: { visible: false } } });
        Composite.add(engine.world, mouseConstraint);

        // CRAZY FLIP MECHANIC
        let lastTapTime = 0;
        let tapCount = 0;

        render.canvas.addEventListener('touchstart', (e) => {
            const now = Date.now();
            if (now - lastTapTime < 250) { // Tapping fast (within 250ms)
                tapCount++;
                if (tapCount >= 3) { // Trigger on 3rd fast tap
                    triggerCrazyFlip(e.touches[0].clientX, e.touches[0].clientY);
                    tapCount = 0; // Reset
                }
            } else {
                tapCount = 1;
            }
            lastTapTime = now;
        });

        function triggerCrazyFlip(x, y) {
            // Physics Blast
            const force = 0.15;
            Body.applyForce(bouch, bouch.position, { 
                x: (Math.random() - 0.5) * force, 
                y: -force * 1.5 
            });
            Body.setAngularVelocity(bouch, (Math.random() - 0.5) * 0.5);

            // UI Animation
            const txt = document.createElement('div');
            txt.className = 'crazy-text';
            txt.innerText = 'CRAZY FLIP!';
            txt.style.left = x + 'px';
            txt.style.top = y + 'px';
            document.body.appendChild(txt);
            setTimeout(() => txt.remove(), 600);

            // Haptic
            if (window.navigator.vibrate) window.navigator.vibrate([30, 10, 30]);
        }

        // Standard Logic
        let totalRotation = 0;
        let lastAngle = bouch.angle;
        Events.on(engine, 'afterUpdate', () => {
            if (!mouseConstraint.constraint.body) {
                let delta = bouch.angle - lastAngle;
                totalRotation += Math.abs(delta);
                if (totalRotation >= Math.PI * 2) {
                    gameState.flips++; totalRotation = 0;
                    if (window.navigator.vibrate) window.navigator.vibrate(20);
                    localStorage.setItem('bouchSave', JSON.stringify(gameState));
                    document.getElementById('flipCount').innerText = gameState.flips;
                }
            }
            lastAngle = bouch.angle;
            // Boundary Safety
            if (bouch.position.y > window.innerHeight + 100 || bouch.position.y < -100) {
                Body.setPosition(bouch, { x: window.innerWidth/2, y: window.innerHeight/2 });
                Body.setVelocity(bouch, {x:0, y:0});
            }
        });

        // UI Handlers
        document.getElementById('inv-toggle').onclick = () => document.getElementById('inventory').classList.toggle('open');
        document.getElementById('theme-toggle').onclick = () => {
            gameState.theme = (gameState.theme === 'light' ? 'dark' : 'light');
            document.body.setAttribute('data-theme', gameState.theme);
        };
        document.getElementById('reset-btn').onclick = () => { Body.setPosition(bouch, { x: window.innerWidth/2, y: window.innerHeight/2 }); Body.setVelocity(bouch, {x:0, y:0}); };

        function renderInventory() {
            const list = document.getElementById('skin-list'); list.innerHTML = '';
            gameState.unlockedSkins.forEach(id => {
                const card = document.createElement('div');
                card.className = `skin-card ${gameState.currentSkin === id ? 'active' : ''}`;
                card.innerText = prestigeTitles[id];
                card.onclick = () => { gameState.currentSkin = id; bouch.render.opacity = 1 - (id * 0.05); renderInventory(); };
                list.appendChild(card);
            });
        }

        renderInventory();
        document.body.setAttribute('data-theme', gameState.theme);
        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
