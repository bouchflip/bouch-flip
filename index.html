<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bouch Flip: Party Edition</title>
    <style>
        :root { --bg: #f0f9ff; --text: #2c3e50; --acc: #3498db; }
        [data-theme="dark"] { --bg: #1a1a1a; --text: #ecf0f1; --acc: #e74c3c; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Arial Black', sans-serif; transition: 0.5s; touch-action: none; -webkit-user-select: none; }

        #stats-container { position: absolute; top: 40px; left: 20px; z-index: 10; pointer-events: none; }
        #flipCount { font-size: 40px; color: var(--text); line-height: 1; }
        
        #controls-container { position: absolute; top: 40px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .btn-ui { padding: 10px 15px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; font-size: 10px; background: var(--text); color: var(--bg); }
        
        #gift-box { 
            position: absolute; width: 60px; height: 60px; background: #f1c40f; 
            border: 4px solid #fff; border-radius: 12px; display: none; z-index: 80;
            justify-content: center; align-items: center; font-size: 30px; cursor: pointer;
            box-shadow: 0 0 20px gold; animation: float 2s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* PARTY STYLES */
        #party-banner { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 50px; color: white; text-shadow: 0 0 20px ff00ff;
            display: none; z-index: 200; pointer-events: none;
        }
        .party-mode { animation: discoBg 5s infinite; }
        @keyframes discoBg {
            0% { background: #ff7eb3; }
            25% { background: #7afcff; }
            50% { background: #feff9c; }
            75% { background: #ff9cf3; }
            100% { background: #ff7eb3; }
        }

        #inventory { position: absolute; bottom: -350px; left: 0; width: 100%; height: 320px; background: rgba(0,0,0,0.95); color: white; transition: 0.4s; z-index: 110; padding: 20px; box-sizing: border-box; border-top: 4px solid var(--acc); border-radius: 30px 30px 0 0; }
        #inventory.open { bottom: 0; }
        .item-grid { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .pwr-item { background: #333; padding: 10px; border-radius: 10px; min-width: 80px; text-align: center; cursor: pointer; }
    </style>
</head>
<body id="main-body">

    <div id="gift-box">🎁</div>
    <div id="party-banner">BOUCH PARTY!!</div>

    <div id="controls-container">
        <button id="bag-btn" class="btn-ui">BAG (0)</button>
        <button id="theme-toggle" class="btn-ui">THEME</button>
        <button id="code-btn" class="btn-ui">CODE</button>
    </div>

    <div id="inventory">
        <h3 style="margin:0">Powerups</h3>
        <div id="pwr-grid" class="item-grid"></div>
    </div>

    <div id="stats-container">
        <div id="flipCount">0</div>
        <span id="rankTag" style="font-size:14px; color:#f1c40f;">Rank: Rookie</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Events, Body } = Matter;
        const engine = Engine.create();
        const render = Render.create({ element: document.body, engine: engine, options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' } });

        let gameState = JSON.parse(localStorage.getItem('bouchSave')) || { flips: 0, bag: { double: 0, magnet: 0, army: 0, party: 0 }, unlockedSkins:[0], currentSkin:0 };
        const bouchImg = new Image(); bouchImg.src = 'Bouch.png';

        const bouch = Bodies.rectangle(window.innerWidth/2, window.innerHeight/2, 100, 140, { chamfer:{radius:20}, frictionAir:0.006, render:{sprite:{texture:'Bouch.png', xScale:0.45, yScale:0.45}}});
        Composite.add(engine.world, [bouch, Bodies.rectangle(window.innerWidth/2, window.innerHeight+50, window.innerWidth, 100, {isStatic:true, render:{visible:false}})]);
        
        const mc = MouseConstraint.create(engine, { mouse: Mouse.create(render.canvas), constraint: { stiffness: 0.1, render: { visible: false } } });
        Composite.add(engine.world, mc);

        let partyActive = false, partyBouches = [];
        let multiplier = 1, lastMilestone = Math.floor(gameState.flips/100);

        function updateUI() {
            document.getElementById('flipCount').innerText = Math.floor(gameState.flips).toLocaleString();
            document.getElementById('bag-btn').innerText = `BAG (${Object.values(gameState.bag).reduce((a,b)=>a+b,0)})`;
            localStorage.setItem('bouchSave', JSON.stringify(gameState));
        }

        // GIFT SYSTEM
        Events.on(engine, 'afterUpdate', () => {
            let m = Math.floor(gameState.flips/100);
            if(m > lastMilestone) { spawnGift(); lastMilestone = m; }
            if(partyActive) gameState.flips += 2; // Party flips!
        });

        function spawnGift() {
            const g = document.getElementById('gift-box');
            g.style.display = 'flex';
            g.style.left = Math.random()*80+'%'; g.style.top = Math.random()*80+'%';
        }

        document.getElementById('gift-box').onclick = () => {
            const r = Math.random();
            let type = 'double';
            if(r > 0.98) type = 'party'; // 2% Super Rare
            else if(r > 0.7) type = 'army';
            else if(r > 0.4) type = 'magnet';
            
            gameState.bag[type]++;
            document.getElementById('gift-box').style.display = 'none';
            updateUI(); renderInv();
        };

        function startParty() {
            partyActive = true;
            const body = document.getElementById('main-body');
            const banner = document.getElementById('party-banner');
            body.classList.add('party-mode');
            banner.style.display = 'block';
            
            // Generate 1000 visual bouches
            for(let i=0; i<1000; i++) {
                partyBouches.push({
                    x: Math.random()*window.innerWidth,
                    y: Math.random()*window.innerHeight,
                    r: Math.random()*Math.PI*2,
                    s: 0.1 + Math.random()*0.2,
                    vx: (Math.random()-0.5)*10,
                    vy: (Math.random()-0.5)*10
                });
            }

            setTimeout(() => {
                partyActive = false;
                partyBouches = [];
                body.classList.remove('party-mode');
                banner.style.display = 'none';
            }, 5000);
        }

        function activatePower(type) {
            if(gameState.bag[type] <= 0) return;
            gameState.bag[type]--;
            if(type === 'party') startParty();
            if(type === 'double') { multiplier=2; setTimeout(()=>multiplier=1, 10000); }
            if(type === 'army') { /* trigger army logic from previous version */ }
            updateUI(); renderInv();
            document.getElementById('inventory').classList.remove('open');
        }

        Events.on(render, 'afterRender', () => {
            if(!partyActive) return;
            const ctx = render.context;
            partyBouches.forEach(b => {
                b.x += b.vx; b.y += b.vy; b.r += 0.2;
                if(b.x < 0 || b.x > window.innerWidth) b.vx *= -1;
                if(b.y < 0 || b.y > window.innerHeight) b.vy *= -1;
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.r);
                ctx.drawImage(bouchImg, -25, -25, 50*b.s, 70*b.s);
                ctx.restore();
            });
        });

        let rot = 0, lAng = bouch.angle;
        Events.on(engine, 'afterUpdate', () => {
            let d = bouch.angle - lAng; rot += Math.abs(d);
            if(rot >= Math.PI*2) { gameState.flips += multiplier; rot=0; updateUI(); }
            lAng = bouch.angle;
        });

        function renderInv() {
            const g = document.getElementById('pwr-grid'); g.innerHTML = '';
            const icons = { double: '×2', magnet: '🧲', army: '🎖️', party: '🥳' };
            Object.keys(gameState.bag).forEach(k => {
                if(gameState.bag[k] > 0) {
                    const d = document.createElement('div'); d.className = 'pwr-item';
                    d.innerHTML = `<div style="font-size:24px">${icons[k]}</div><div style="font-size:10px">${k.toUpperCase()} (${gameState.bag[k]})</div>`;
                    d.onclick = () => activatePower(k);
                    g.appendChild(d);
                }
            });
        }

        document.getElementById('bag-btn').onclick = () => document.getElementById('inventory').classList.toggle('open');
        updateUI(); renderInv();
        Render.run(render); Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
